<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirill Welsh | Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0c;
            --tg-color: #0088cc;
            --wa-color: #25d366;
            --max-color: #ff3b30; /* Цвет твоего градиента */
            --tg-shadow: rgba(0, 136, 204, 0.2);
            --wa-shadow: rgba(37, 211, 102, 0.2);
            --max-shadow: rgba(255, 59, 48, 0.2);
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a1c 0%, #0b0b0c 100%);
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 50px 40px;
            border-radius: 40px;
            text-align: center;
            width: 320px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.7);
            animation: cardAppear 1s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .qr-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 35px;
            background: white;
            border-radius: 24px;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(255,255,255,0.03); /* Начальная тень */
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .qr-container img {
            width: 100%;
            height: 100%;
            display: none; /* Скрыты по умолчанию */
            border-radius: 10px;
            animation: qrIn 0.4s ease;
        }

        .qr-container img.active { display: block; }

        @keyframes qrIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.04);
            padding: 12px;
            border-radius: 20px;
        }

        .btn {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            font-size: 24px;
            color: #666;
            background: transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover { transform: translateY(-4px); color: white; }
        .btn.active { color: white; background: rgba(255,255,255,0.08); }

        .btn-tg.active { color: var(--tg-color); }
        .btn-wa.active { color: var(--wa-color); }
        .btn-mx.active { color: var(--max-color); }

        .btn-mx img { width: 28px; height: 28px; opacity: 0.5; filter: grayscale(1); transition: opacity 0.3s; }
        .btn-mx.active img { opacity: 1; filter: grayscale(0); }

        h2 { font-weight: 600; margin-bottom: 5px; font-size: 26px; letter-spacing: -0.5px; }
        p { color: #888; font-size: 14px; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="profile-card">
    <h2>Kirill</h2>
    <p>Professional Developer</p>

<div class="qr-container" id="qrContainer">
    <img src="my_tg.png" id="qr-tg" class="active">
    <img src="my_wa.png" id="qr-wa">
    <img src="max_qr.png" id="qr-mx">
</div>

    <div class="selector">
        <button class="btn btn-tg active" onclick="showQR('tg')"><i class="fab fa-telegram"></i></button>
        <button class="btn btn-wa" onclick="showQR('wa')"><i class="fab fa-whatsapp"></i></button>
        <button class="btn btn-mx" onclick="showQR('mx')">
            <img src="Max_logo-64x64.png" alt="Max">
        </button>
    </div>
</div>

<script>
    function showQR(platform) {
        // Убираем активные классы у кнопок и картинок
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.qr-container img').forEach(i => i.classList.remove('active'));

        // Добавляем активные классы нужным элементам
        document.querySelector('.btn-' + platform).classList.add('active');
        document.getElementById('qr-' + platform).classList.add('active');

        // Меняем свечение контейнера в зависимости от платформы
        const container = document.getElementById('qrContainer');
        if(platform === 'tg') container.style.boxShadow = '0 0 30px rgba(0, 136, 204, 0.4)';
        if(platform === 'wa') container.style.boxShadow = '0 0 30px rgba(37, 211, 102, 0.4)';
        if(platform === 'mx') container.style.boxShadow = '0 0 30px rgba(255, 59, 48, 0.4)';
    }
    // Устанавливаем начальное свечение при загрузке
    showQR('tg');
</script>

</body>
</html>
